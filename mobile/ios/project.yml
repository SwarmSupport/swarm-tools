name: SwarmToolsMobile
options:
  bundleIdPrefix: com.northstar
  deploymentTarget:
    iOS: "16.0"
targets:
  Northstar:
    type: application
    platform: iOS
    sources: [Northstar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.northstar.mobile
        SWIFT_VERSION: 5.9
        CODE_SIGN_ENTITLEMENTS: Northstar/Northstar.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Swarm Tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PacketTunnel
        embed: true
      - framework: Frameworks/STCore.xcframework
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources: [PacketTunnel]
    dependencies:
      - framework: Frameworks/STCore.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.northstar.mobile.PacketTunnel
        SWIFT_VERSION: 5.9
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        INFOPLIST_FILE: PacketTunnel/Info.plist
